# XcodeGen 工程配置
# 本地 / CI 中使用: brew install xcodegen && xcodegen generate
name: YxiOS
options:
  bundleIdPrefix: com.daijincy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "2.0.5"
    CURRENT_PROJECT_VERSION: "16"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_BITCODE: NO
targets:
  YxiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YxiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daijincy.yxios
        INFOPLIST_FILE: YxiOS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
      gatherCoverageData: false
